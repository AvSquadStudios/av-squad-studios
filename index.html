
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050812">
  <title>AV Squad Studios | A Universe of Stories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="universe">

    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="ambient ambient-three"></div>

    <div class="top-label">
      <span class="status-dot"></span>
      AV SQUAD STUDIOS PRESENTS
    </div>

    <section class="intro">
      <p class="eyebrow">A UNIVERSE OF STORIES</p>

      <h1>
        EVERY STORY HAS A
        <span>WORLD.</span>
      </h1>

      <p class="subtitle">
        We bring every world to life through cinematic storytelling.
      </p>
    </section>

    <section class="bubble-stage" id="bubbleStage">
      <div class="orbit orbit-one"></div>
      <div class="orbit orbit-two"></div>
      <div class="center-glow"></div>

      <div class="bubble-container" id="bubbleContainer"></div>

      <div class="final-message" id="finalMessage">
        <div class="final-orb"></div>
        <p class="final-small">TWENTY GENRES. INFINITE POSSIBILITIES.</p>
        <h2>YOUR STORY.<br><span>OUR CINEMATIC VISION.</span></h2>
        <p class="final-caption">AV SQUAD STUDIOS</p>
        <button id="replayButton">EXPERIENCE AGAIN ↗</button>
      </div>
    </section>

    <div class="bottom-label">
      <span>IMAGINATION HAS NO LIMITS</span>
      <span class="counter" id="counter">01 / 20</span>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
